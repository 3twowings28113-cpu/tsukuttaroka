<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FFDE59">
<title>パネラー用｜投稿を読む</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Zen+Maru+Gothic:wght@900&display=swap">
<style>
  /* パネラー用：会場でスマホを持って、届いた投稿を読んで★を付ける。読むことが仕事なので、文字は大きく、状態（新着・未読・★）がひと目で分かるように */
  :root {
    color-scheme: light;
    --yellow: #FFDE59; --ink: #121212; --paper: #FFFFFF; --feed: #F4F2EE;
    --blue: #0A66C2; --blue-press: #004182; --coral: #FF7373; --muted: #5C574C; --rule: #D9D3C6;
    --line: 2px; --r: 14px; --shadow: 3px 3px 0 var(--ink);
    --f-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Noto Sans JP", sans-serif;
    --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { margin: 0; background: var(--feed); color: var(--ink); font: 500 16px/1.6 var(--f-body); -webkit-tap-highlight-color: transparent; }
  body.no-scroll { overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* 上のバー */
  .top { position: sticky; top: 0; z-index: 20; background: var(--yellow); border-bottom: var(--line) solid var(--ink); padding-top: env(safe-area-inset-top, 0px); }
  .top-in { max-width: 720px; margin: 0 auto; padding: 10px 16px 12px; display: grid; gap: 10px; }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .title { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: 19px; line-height: 1.3; }
  .title small { display: block; font-family: var(--f-body); font-weight: 700; font-size: 12px; word-break: keep-all; overflow-wrap: anywhere; }
  .me-btn { flex: none; display: inline-flex; align-items: center; gap: 4px; min-height: 40px; padding: 0 12px; border: var(--line) solid var(--ink); border-radius: 999px; background: var(--paper); font-weight: 700; font-size: 14px; }
  .me-btn svg { width: 14px; height: 14px; }
  .state { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 13px; font-weight: 700; }
  .conn { display: inline-flex; align-items: center; gap: 6px; }
  .conn i { width: 9px; height: 9px; border-radius: 50%; background: #1E7A46; }
  .conn.ng i { background: #B3261E; }
  .alert-off { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 10px; border: var(--line) solid var(--ink); border-radius: 999px; background: var(--paper); font-weight: 700; font-size: 13px; }
  .alert-on { display: inline-flex; align-items: center; gap: 6px; }

  /* 絞り込み */
  .tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: var(--line) solid var(--ink); border-radius: 12px; overflow: hidden; background: var(--paper); }
  .tabs button { min-height: 44px; padding: 4px 4px; border: 0; border-right: var(--line) solid var(--ink); background: transparent; font-weight: 700; font-size: 14px; }
  .tabs button:last-child { border-right: 0; }
  .tabs button[aria-pressed="true"] { background: var(--blue); color: #fff; }
  .tabs b { font-variant-numeric: tabular-nums; margin-left: 4px; }
  .feed-link { display: grid; gap: 2px; font-size: 12px; }
  .feed-link a { color: var(--blue); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .feed-note { margin: 0; font-size: 11px; color: var(--muted); }
  .tag-picked { background: var(--yellow); }

  main { max-width: 720px; margin: 0 auto; padding: 14px 16px calc(40px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }

  /* 通知をオンにするお願い */
  .ask { display: grid; gap: 8px; padding: 14px; background: var(--paper); border: var(--line) solid var(--ink); border-radius: var(--r); box-shadow: var(--shadow); }
  .ask b { font-size: 16px; }
  .ask p { margin: 0; font-size: 14px; color: var(--muted); }
  /* 説明なしでも分かるように（使い方） */
  .howto { margin: 0; padding: 10px 12px; background: var(--paper); border: var(--line) solid var(--ink); border-radius: var(--r); font-size: 14px; font-weight: 700; line-height: 1.65; }
  .howto b { color: var(--blue); }
  .howto .n { display: inline-grid; place-items: center; width: 20px; height: 20px; margin-right: 4px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--yellow); font-size: 11px; font-weight: 900; vertical-align: -2px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 18px; border: var(--line) solid var(--ink); border-radius: 12px; background: var(--paper); box-shadow: var(--shadow); font-weight: 700; font-size: 16px; text-decoration: none; color: var(--ink); }
  .btn:active { transform: translate(3px, 3px); box-shadow: none; }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-primary:active { background: var(--blue-press); }
  .btn-block { width: 100%; }

  /* 一覧 */
  .list { display: grid; gap: 12px; overflow-anchor: none; }
  .card { position: relative; background: var(--paper); border: var(--line) solid var(--ink); border-radius: var(--r); box-shadow: var(--shadow); }
  .card.is-new { border-left: 8px solid var(--coral); }
  .card-open { display: block; width: 100%; padding: 12px 78px 14px 14px; border: 0; background: none; text-align: left; border-radius: var(--r); }
  .card-top { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 10px; }
  .who { font-size: 18px; font-weight: 700; line-height: 1.35; }
  .who small { font-size: 13px; margin-left: 1px; }
  .when { font-size: 13px; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 4px; }
  .tag { display: inline-flex; align-items: center; gap: 5px; padding: 0 8px; border: 1.5px solid var(--ink); border-radius: 999px; font-size: 12px; font-weight: 700; line-height: 20px; background: var(--paper); }
  .tag-new { background: var(--coral); }
  .tag-unread::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--coral); border: 1px solid var(--ink); }
  .excerpt { margin: 0; font-size: 15px; line-height: 1.6; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; overflow-wrap: anywhere; }
  .excerpt.none { color: var(--muted); }
  .star { position: absolute; top: 6px; right: 6px; width: 64px; height: 60px; display: grid; place-items: center; align-content: center; gap: 1px; border: 0; border-radius: 12px; background: none; }
  .star svg { width: 30px; height: 30px; }
  .star .slbl { font-size: 11px; font-weight: 900; line-height: 1; color: var(--muted); }
  .star[aria-pressed="true"] .slbl { color: var(--ink); }
  .star svg path { fill: var(--paper); stroke: var(--ink); stroke-width: 1.8; stroke-linejoin: round; }
  .star[aria-pressed="true"] svg path { fill: var(--yellow); }
  .empty { padding: 28px 18px; text-align: center; background: var(--paper); border: var(--line) dashed var(--ink); border-radius: var(--r); font-size: 15px; line-height: 1.7; }
  .empty b { display: block; font-family: var(--f-display); font-weight: 900; font-size: 18px; margin-bottom: 4px; }
  .list-foot { display: flex; justify-content: center; }
  .btn-text { min-height: 44px; padding: 0 12px; border: 0; background: none; font-weight: 700; font-size: 14px; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; }

  /* 新着のお知らせ（上に出る帯） */
  .banner { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 132px); z-index: 30; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border: var(--line) solid var(--ink); border-radius: 999px; background: var(--coral); box-shadow: var(--shadow); font-weight: 700; font-size: 15px; white-space: nowrap; }

  /* 全文 */
  .detail { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; background: var(--feed); }
  .d-bar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px; background: var(--yellow); border-bottom: var(--line) solid var(--ink); }
  .d-back { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 12px 0 6px; border: var(--line) solid var(--ink); border-radius: 999px; background: var(--paper); font-weight: 700; font-size: 15px; }
  .d-back svg { width: 20px; height: 20px; }
  .d-pos { font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
  .d-star { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px 0 8px; border: var(--line) solid var(--ink); border-radius: 999px; background: var(--paper); font-weight: 700; font-size: 15px; }
  .d-star svg { width: 26px; height: 26px; }
  .d-star svg path { fill: var(--paper); stroke: var(--ink); stroke-width: 1.8; stroke-linejoin: round; }
  .d-star[aria-pressed="true"] { background: var(--ink); color: var(--yellow); }
  .d-star[aria-pressed="true"] svg path { fill: var(--yellow); stroke: var(--yellow); }
  .d-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .d-in { max-width: 680px; margin: 0 auto; padding: 18px 16px 28px; display: grid; gap: 14px; }
  .d-name { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: 26px; line-height: 1.3; }
  .d-name small { font-size: 16px; margin-left: 2px; }
  .d-meta { margin: -8px 0 0; font-size: 14px; font-weight: 700; color: var(--muted); }
  .d-body { padding: 16px; background: var(--paper); border: var(--line) solid var(--ink); border-radius: var(--r); font-size: 17px; line-height: 1.85; white-space: pre-wrap; overflow-wrap: anywhere; }
  .d-body .ht { color: var(--blue); font-weight: 700; }
  .d-body.none { color: var(--muted); }
  .d-note { margin: 0; font-size: 13px; color: var(--muted); }
  .d-nav { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--yellow); border-top: var(--line) solid var(--ink); }
  .d-nav .btn { min-height: 50px; font-size: 15px; }
  .d-nav .btn[disabled] { opacity: 0.4; box-shadow: none; cursor: default; }

  /* 名前を選ぶ・入れない */
  .gate { max-width: 520px; margin: 0 auto; padding: 28px 16px; display: grid; gap: 14px; }
  .gate h2 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: 24px; line-height: 1.35; }
  .gate p { margin: 0; font-size: 15px; }
  .who-list { display: grid; gap: 10px; }
  .who-list .btn { justify-content: flex-start; min-height: 58px; font-size: 18px; }
  .who-list .btn[aria-pressed="true"] { background: var(--blue); color: #fff; }

  /* 雲のお知らせ（この画面の見せ場） */
  .cloud { position: relative; isolation: isolate; }
  .cloud > svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; overflow: visible; pointer-events: none; }
  .cloud > svg path { fill: var(--paper); stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; }
  .toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 60; width: max-content; max-width: calc(100vw - 32px); transform: translate(-50%, 10px) scale(0.9); opacity: 0; pointer-events: none; transition: opacity 0.18s, transform 0.18s; }
  .toast.is-on { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }
  .toast-cloud { padding: 18px 24px; text-align: center; font-family: var(--f-display); font-weight: 900; font-size: 18px; line-height: 1.45; }
  body.detail-open .toast { bottom: calc(88px + env(safe-area-inset-bottom, 0px)); }

  @media (prefers-reduced-motion: no-preference) {
    .card.is-new { animation: arrive 0.5s cubic-bezier(0.2, 1.4, 0.4, 1) both; }
    @keyframes arrive { from { transform: translateY(-10px); opacity: 0; } }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media (min-width: 640px) {
    .list { grid-template-columns: 1fr 1fr; }
    .list .empty, .list .list-foot { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<header class="top" id="top" hidden>
  <div class="top-in">
    <div class="top-row">
      <h1 class="title">届いた投稿<small>パネラー用｜<wbr>関西を、<wbr>おもろくする夜。</small></h1>
      <button type="button" class="me-btn" id="meBtn" data-act="who"></button>
    </div>
    <div class="state" id="state"></div>
    <div class="tabs" role="group" aria-label="絞り込み" id="tabs"></div>
    <div class="feed-link" id="feedWrap" hidden>
      <a id="feedLink" target="_blank" rel="noopener"></a>
      <p class="feed-note">アプリを使わずに投稿した人の分は、こちらで探せます</p>
    </div>
  </div>
</header>

<main id="main"></main>

<button type="button" class="banner" id="banner" data-act="toTop" hidden></button>
<div class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="dName" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script>
(() => {
  "use strict";
  const C = window.APP_CONFIG || {};
  const JUDGES = [...(Array.isArray(C.judges) ? C.judges : []), "運営スタッフ"];
  const K = { token: "tsukuttaroka.judge.k", me: "tsukuttaroka.judge.me", read: "tsukuttaroka.judge.read", filter: "tsukuttaroka.judge.filter" };
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const honor = (n) => (/(さん|様|さま|くん|ちゃん)$/.test(n) ? n : `${n}さん`);
  const nameParts = (n) => (/(さん|様|さま|くん|ちゃん)$/.test(n) ? [n.replace(/(さん|様|さま|くん|ちゃん)$/, ""), n.match(/(さん|様|さま|くん|ちゃん)$/)[0]] : [n, "さん"]);

  const ICON = {
    star: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.75 5.6 6.15.9-4.45 4.33 1.05 6.12L12 16.87l-5.5 2.88 1.05-6.12L3.1 9.3l6.15-.9z"/></svg>',
    back: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    down: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  };

  // リンクの鍵は覚えて、アドレス欄からは消す（スクショや共有で広がらないように）
  const params = new URLSearchParams(location.search);
  if (params.get("k")) {
    store.set(K.token, params.get("k"));
    history.replaceState(null, "", location.pathname);
  }
  const token = store.get(K.token) || "";
  let me = store.get(K.me) || "";
  let read = {};
  try { read = JSON.parse(store.get(K.read) || "{}") || {}; } catch {}
  let filter = ["all", "unread", "star", "nobody"].includes(store.get(K.filter)) ? store.get(K.filter) : "all";

  const items = new Map();       // id -> 投稿
  let serverStars = new Set();   // サーバーに保存済みの★
  let picks = {};                // report_id -> 選んだ審査員の名前の配列（全員分）
  const starPending = new Map(); // id -> on（保存中は画面の表示を優先）
  const fresh = new Set();       // 新着の印を付けている投稿
  let since = 0, loaded = false, fails = 0, timer = null, authBad = !token, picking = !me;
  let alertsOn = false, audio = null, wake = null;
  let openId = null, navList = [], unseen = 0;

  // ---------- データ ----------
  const isStar = (id) => (starPending.has(id) ? starPending.get(id) : serverStars.has(id));
  const isUnread = (it) => !(read[it.id] >= it.updatedAt);
  const pickersOf = (id) => (Array.isArray(picks[id]) ? picks[id] : []).filter((n) => n !== me);
  const pickedText = (id) => {
    const o = pickersOf(id);
    if (!o.length) return "";
    return o.length === 1 ? `${o[0]}も選んだ` : `${o.join("・")}が選んだ`;
  };
  function sorted() {
    return [...items.values()].sort((a, b) => b.createdAt - a.createdAt);
  }
  function filtered() {
    const all = sorted();
    if (filter === "unread") return all.filter(isUnread);
    if (filter === "star") return all.filter((it) => isStar(it.id));
    if (filter === "nobody") return all.filter((it) => !(picks[it.id] || []).length);
    return all;
  }
  function markRead(id) {
    const it = items.get(id);
    if (!it) return;
    read[id] = it.updatedAt;
    store.set(K.read, JSON.stringify(read));
  }

  async function poll() {
    clearTimeout(timer);
    if (authBad || picking) return;
    if (document.hidden && loaded) {
      timer = setTimeout(poll, 15000);
      return;
    }
    try {
      const q = new URLSearchParams({ j: me, since: String(Math.max(0, since - 5000)) });
      const res = await fetch(`api/judge/feed?${q}`, { headers: { "x-judge-key": token }, cache: "no-store" });
      if (res.status === 401) {
        authBad = true;
        render();
        return;
      }
      const d = await res.json();
      if (!res.ok || !d.ok) throw new Error(d.message || "feed");
      fails = 0;
      apply(d);
    } catch {
      fails += 1;
      renderState();
    }
    timer = setTimeout(poll, fails ? Math.min(20000, 3000 * (fails + 1)) : 4000);
  }

  function apply(d) {
    serverStars = new Set(d.stars || []);
    picks = d.picks && typeof d.picks === "object" ? d.picks : {};
    const arrived = [];
    let changed = false;
    for (const it of d.items || []) {
      since = Math.max(since, it.updatedAt || 0);
      if (it.hidden) {
        if (items.delete(it.id)) changed = true;
        continue;
      }
      const prev = items.get(it.id);
      if (!prev) {
        if (loaded) arrived.push(it);
        changed = true;
      } else if (prev.updatedAt !== it.updatedAt) changed = true;
      items.set(it.id, it);
    }
    const first = !loaded;
    loaded = true;
    if (arrived.length) {
      for (const it of arrived) fresh.add(it.id);
      setTimeout(() => {
        for (const it of arrived) fresh.delete(it.id);
        renderList();
      }, 12000);
    }
    if (changed || first) renderList(true);
    else renderTabs();
    renderState();
    if (arrived.length) announce(arrived);
    if (openId && !items.has(openId)) closeDetail();
    else if (openId && changed) renderDetail();
  }

  // ---------- 新着の知らせ ----------
  function announce(arrived) {
    unseen += arrived.length;
    document.title = `(${unseen}) 届いた投稿｜パネラー用`;
    const names = arrived.slice(0, 2).map((it) => honor(it.name)).join("と");
    toast(arrived.length > 2 ? `${names}ほか${arrived.length - 2}人が投稿したで！` : `${names}が投稿したで！`, 3600);
    if (alertsOn) {
      chime();
      try { navigator.vibrate && navigator.vibrate([90, 70, 90]); } catch {}
    }
    showBanner();
  }
  function showBanner() {
    const b = $("#banner");
    const away = openId || window.scrollY > 160;
    b.hidden = !(unseen > 0 && away);
    b.innerHTML = `新しい投稿 ${unseen}件 <span aria-hidden="true">↑</span>`;
  }
  function clearUnseen() {
    unseen = 0;
    document.title = "届いた投稿｜パネラー用";
    $("#banner").hidden = true;
  }
  function chime() {
    if (!audio) return;
    try {
      if (audio.state === "suspended") audio.resume();
      const t = audio.currentTime + 0.02;
      [[880, 0], [1318.5, 0.17]].forEach(([f, dt]) => {
        const o = audio.createOscillator();
        const g = audio.createGain();
        o.type = "sine";
        o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t + dt);
        g.gain.exponentialRampToValueAtTime(0.4, t + dt + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.55);
        o.connect(g).connect(audio.destination);
        o.start(t + dt);
        o.stop(t + dt + 0.6);
      });
      window.__chimes = (window.__chimes || 0) + 1;
    } catch {}
  }
  async function enableAlerts() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        audio = audio || new AC();
        if (audio.state === "suspended") await audio.resume();
      }
      if (navigator.audioSession) navigator.audioSession.type = "playback";
    } catch {}
    alertsOn = true;
    chime();
    try { navigator.vibrate && navigator.vibrate(60); } catch {}
    await keepAwake();
    render();
    toast("通知をオンにしたで", 1600);
  }
  async function keepAwake() {
    try {
      if ("wakeLock" in navigator && !document.hidden && !wake) {
        wake = await navigator.wakeLock.request("screen");
        wake.addEventListener("release", () => { wake = null; renderState(); });
      }
    } catch {}
    renderState();
  }

  // ---------- ★ ----------
  async function toggleStar(id) {
    const on = !isStar(id);
    starPending.set(id, on);
    syncStar(id);
    try {
      const res = await fetch("api/judge/star", {
        method: "POST",
        headers: { "content-type": "application/json", "x-judge-key": token },
        body: JSON.stringify({ j: me, id, on }),
      });
      const d = await res.json().catch(() => ({}));
      if (!res.ok || !d.ok) throw new Error();
      if (on) serverStars.add(id);
      else serverStars.delete(id);
      starPending.delete(id);
      toast(on ? "★候補に入れたで" : "★を外したで", 1200);
    } catch {
      starPending.delete(id);
      toast("★を保存できへんかった。もう一回押してな", 2400);
    }
    syncStar(id);
  }
  function syncStar(id) {
    const on = isStar(id);
    document.querySelectorAll(`[data-act="star"][data-id="${CSS.escape(id)}"]`).forEach((b) => {
      b.setAttribute("aria-pressed", String(on));
      if (b.classList.contains("d-star")) b.querySelector(".lbl").textContent = on ? "選んだ" : "この人を選ぶ";
      const slbl = b.querySelector(".slbl");
      if (slbl) slbl.textContent = on ? "選んだ" : "選ぶ";
    });
    renderTabs();
    if (filter === "star" && !openId) renderList();
  }

  // ---------- 表示 ----------
  const fmtTime = (ms) => new Date(ms).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
  function ago(ms) {
    const m = Math.floor((Date.now() - ms) / 60000);
    if (m < 1) return "たった今";
    if (m < 60) return `${m}分前`;
    return `${Math.floor(m / 60)}時間前`;
  }
  const bodyHtml = (t) => esc(t).replace(/(^|\s)(#[^\s#]+)/g, '$1<span class="ht">$2</span>');

  function render() {
    const main = $("#main");
    if (authBad) {
      $("#top").hidden = true;
      main.innerHTML = `<section class="gate"><h2>このページは、パネラー専用です</h2><p>運営から届いたリンクから開いてください。リンクが古いときは、運営に新しいリンクをもらってください。</p></section>`;
      return;
    }
    if (picking) {
      $("#top").hidden = true;
      main.innerHTML = `<section class="gate">
        <h2>どなたですか？</h2>
        <p>★（候補）は、名前ごとに分けて保存します。</p>
        <div class="who-list" role="group" aria-label="名前">
          ${JUDGES.map((n) => `<button type="button" class="btn" data-act="pick" data-name="${esc(n)}" aria-pressed="${n === me}">${esc(n)}</button>`).join("")}
        </div>
      </section>`;
      return;
    }
    $("#top").hidden = false;
    $("#meBtn").innerHTML = `${esc(me)}${ICON.down}`;
    const fw = $("#feedWrap"), fl = $("#feedLink");
    if (fw && fl) {
      if (C.feedTag) {
        fw.hidden = false;
        fl.href = "https://www.linkedin.com/search/results/content/?keywords=" + encodeURIComponent(C.feedTag) + "&sortBy=%22date_posted%22";
        fl.textContent = `LinkedInで ${C.feedTag} を見る`;
      } else {
        fw.hidden = true;
      }
    }
    renderState();
    renderTabs();
    renderList();
  }

  function renderState() {
    const el = $("#state");
    if (!el || picking || authBad) return;
    const conn = fails ? '<span class="conn ng"><i></i>つながらへん…自動でつなぎ直し中</span>' : '<span class="conn"><i></i>自動で更新中</span>';
    const alerts = alertsOn
      ? `<span class="alert-on">音とバイブ：オン${wake ? "・画面は消えへん" : ""}</span>`
      : '<button type="button" class="alert-off" data-act="alerts">音とバイブ：オフ（オンにする）</button>';
    el.innerHTML = conn + alerts;
  }

  function renderTabs() {
    const el = $("#tabs");
    if (!el || picking || authBad) return;
    const all = sorted();
    const n = {
      all: all.length,
      unread: all.filter(isUnread).length,
      star: all.filter((it) => isStar(it.id)).length,
      nobody: all.filter((it) => !(picks[it.id] || []).length).length,
    };
    const label = { all: "ぜんぶ", unread: "未読", star: "★自分", nobody: "まだ誰も" };
    el.innerHTML = ["all", "unread", "star", "nobody"]
      .map((k) => `<button type="button" data-act="filter" data-f="${k}" aria-pressed="${filter === k}">${label[k]}<b>${n[k]}</b></button>`)
      .join("");
  }

  function cardHtml(it) {
    const [nm, hon] = nameParts(it.name);
    const unread = isUnread(it);
    const body = String(it.body || "").replace(/\s+/g, " ").trim();
    const tags = [
      fresh.has(it.id) ? '<span class="tag tag-new">新着</span>' : "",
      unread ? '<span class="tag tag-unread">未読</span>' : "",
      `<span class="tag">${it.source === "self" ? "自分で書いた" : "アプリで作成"}</span>`,
      it.url ? '<span class="tag">リンクあり</span>' : "",
      pickedText(it.id) ? `<span class="tag tag-picked">${esc(pickedText(it.id))}</span>` : "",
    ].join("");
    return `<article class="card${fresh.has(it.id) ? " is-new" : ""}" data-id="${esc(it.id)}">
      <button type="button" class="card-open" data-act="open" data-id="${esc(it.id)}" aria-label="${esc(honor(it.name))}の投稿を読む">
        <span class="card-top"><span class="who">${esc(nm)}<small>${esc(hon)}</small></span><span class="when">${fmtTime(it.createdAt)}・${ago(it.createdAt)}</span></span>
        <span class="tags">${tags}</span>
        <span class="excerpt${body ? "" : " none"}">${body ? esc(body.slice(0, 180)) : "本文なし（リンクから読めます）"}</span>
      </button>
      <button type="button" class="star" data-act="star" data-id="${esc(it.id)}" aria-pressed="${isStar(it.id)}" aria-label="この投稿を自分の賞に選ぶ">${ICON.star}<span class="slbl">${isStar(it.id) ? "選んだ" : "選ぶ"}</span></button>
    </article>`;
  }

  function renderList(keepPlace) {
    const main = $("#main");
    if (picking || authBad) return;
    // 上に新着が入っても、いま読んでいる位置がずれないようにする
    let anchor = null;
    if (keepPlace && window.scrollY > 0) {
      const topH = $("#top").offsetHeight;
      for (const c of main.querySelectorAll(".card")) {
        const r = c.getBoundingClientRect();
        if (r.bottom > topH) { anchor = { id: c.dataset.id, top: r.top }; break; }
      }
    }
    const list = filtered();
    const ask = alertsOn
      ? ""
      : `<section class="ask"><b>新しい投稿が来たら、音とバイブで知らせます</b><p>下のボタンを1回押してください。画面も自動で消えないようにします。iPhoneはマナーモードだと音が鳴りません。</p><button type="button" class="btn btn-primary btn-block" data-act="alerts">通知をオンにする</button></section>`;
    const howto = `<p class="howto"><span class="n">1</span>届いた投稿をタップすると、全文が読めるで。<br><span class="n">2</span>いいと思った人の <b>☆選ぶ</b> を押すと、あなたの賞の候補になるで（「★自分」タブに入るで）。<br><span class="n">3</span>下のタブで <b>未読</b>／<b>★自分</b>／<b>まだ誰も</b> に切り替えられるで。</p>`;
    let content;
    if (!loaded) content = '<div class="empty"><b>読み込み中…</b></div>';
    else if (!list.length) {
      content =
        filter === "star"
          ? '<div class="empty"><b>★候補はまだありません</b>気になった投稿の☆を押すと、ここに集まります。</div>'
          : filter === "nobody"
          ? '<div class="empty"><b>まだ誰も選んでいません</b>★を押した投稿は、ここから消えます。</div>'
          : filter === "unread"
          ? '<div class="empty"><b>未読はありません</b>新しい投稿が届くと、ここに出ます。</div>'
          : '<div class="empty"><b>まだ届いていません</b>参加者が「投稿したで！」と報告すると、ここに出ます。<br>この画面は開いたままでOKです。</div>';
    } else {
      content = list.map(cardHtml).join("");
      if (filter === "unread") content += '<div class="list-foot"><button type="button" class="btn-text" data-act="readAll">ぜんぶ既読にする</button></div>';
    }
    main.innerHTML = `${howto}${ask}<div class="list" id="list">${content}</div>`;
    paintClouds(main);
    if (anchor) {
      const c = main.querySelector(`.card[data-id="${CSS.escape(anchor.id)}"]`);
      if (c) window.scrollBy(0, c.getBoundingClientRect().top - anchor.top);
    }
    renderTabs();
  }

  // ---------- 全文 ----------
  function openDetail(id, fromList) {
    if (!items.has(id)) return;
    if (fromList || !navList.includes(id)) navList = filtered().map((it) => it.id);
    if (!navList.includes(id)) navList = sorted().map((it) => it.id);
    const wasOpen = !!openId;
    openId = id;
    markRead(id);
    if (!wasOpen) history.pushState({ judgeDetail: true }, "");
    document.body.classList.add("no-scroll", "detail-open");
    $("#detail").hidden = false;
    renderDetail();
    $("#detail .d-scroll").scrollTop = 0;
    $("#detail .d-back").focus({ preventScroll: true });
    renderTabs();
    showBanner();
  }
  function renderDetail() {
    const it = items.get(openId);
    if (!it) return;
    const i = navList.indexOf(openId);
    const [nm, hon] = nameParts(it.name);
    const body = String(it.body || "").trim();
    $("#detail").innerHTML = `
      <div class="d-bar">
        <button type="button" class="d-back" data-act="close">${ICON.back}一覧</button>
        <span class="d-pos">${i + 1} / ${navList.length}</span>
        <button type="button" class="d-star" data-act="star" data-id="${esc(it.id)}" aria-pressed="${isStar(it.id)}">${ICON.star}<span class="lbl">${isStar(it.id) ? "選んだ" : "この人を選ぶ"}</span></button>
      </div>
      <div class="d-scroll">
        <div class="d-in">
          <h2 class="d-name" id="dName" tabindex="-1">${esc(nm)}<small>${esc(hon)}</small></h2>
          <p class="d-meta">${fmtTime(it.createdAt)}に報告・${it.source === "self" ? "自分で書いた投稿" : "アプリで作った投稿"}${pickedText(it.id) ? `・${esc(pickedText(it.id))}` : ""}</p>
          <div class="d-body${body ? "" : " none"}">${body ? bodyHtml(body) : "本文は届いていません。下のボタンからLinkedInで読めます。"}</div>
          ${it.url ? `<a class="btn btn-primary btn-block" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">LinkedInで本物を見る</a>` : '<p class="d-note">リンクはありません。上の本文は、本人がアプリから送った文章です。</p>'}
          ${it.url && it.source !== "self" ? '<p class="d-note">上の本文はアプリで作った文章です。LinkedInで少し直している人もいます。</p>' : ""}
        </div>
      </div>
      <div class="d-nav">
        <button type="button" class="btn" data-act="prev"${i <= 0 ? " disabled" : ""}>← 前の投稿</button>
        <button type="button" class="btn" data-act="next"${i < 0 || i >= navList.length - 1 ? " disabled" : ""}>次の投稿 →</button>
      </div>`;
  }
  function closeDetail(fromPop) {
    if (!openId) return;
    const id = openId;
    openId = null;
    $("#detail").hidden = true;
    $("#detail").innerHTML = "";
    document.body.classList.remove("no-scroll", "detail-open");
    if (!fromPop && history.state && history.state.judgeDetail) history.back();
    renderList();
    const c = document.querySelector(`.card[data-id="${CSS.escape(id)}"] .card-open`);
    if (c) c.focus({ preventScroll: false });
    showBanner();
  }
  function step(d) {
    const i = navList.indexOf(openId);
    const next = navList[i + d];
    if (!next || !items.has(next)) return;
    openId = next;
    markRead(next);
    renderDetail();
    $("#detail .d-scroll").scrollTop = 0;
    renderTabs();
  }

  // ---------- 雲のお知らせ ----------
  let toastTimer = null;
  function toast(msg, ms = 1800) {
    const el = $("#toast");
    el.innerHTML = `<div class="toast-cloud cloud" data-bump="22" data-seed="${1 + Math.floor(Math.random() * 40)}"><span>${esc(msg)}</span></div>`;
    el.classList.add("is-on");
    paintClouds(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("is-on"), ms);
  }
  function rng(seed) { let a = seed >>> 0 || 1; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function cloudPath(w, h, bump, seed) {
    const rand = rng(seed * 9973 + Math.round(w) * 7 + Math.round(h));
    const m = Math.round(bump * 0.34) + 3; const pts = [];
    const edge = (ax, ay, bx, by) => { const L = Math.hypot(bx - ax, by - ay); const n = Math.max(1, Math.ceil(L / bump)); for (let i = 0; i < n; i++) { let t = i / n; if (i > 0) t += ((rand() - 0.5) * 0.35) / n; pts.push([ax + (bx - ax) * t, ay + (by - ay) * t]); } };
    edge(m, m, w - m, m); edge(w - m, m, w - m, h - m); edge(w - m, h - m, m, h - m); edge(m, h - m, m, m);
    let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for (let i = 0; i < pts.length; i++) { const [ax, ay] = pts[i]; const [bx, by] = pts[(i + 1) % pts.length]; const c = Math.hypot(bx - ax, by - ay); const r = Math.max(c * 0.52, c * 0.6 * (0.94 + rand() * 0.2)); d += ` A${r.toFixed(1)},${r.toFixed(1)} 0 0 1 ${bx.toFixed(1)},${by.toFixed(1)}`; }
    return d + "Z";
  }
  function paintClouds(root) {
    root.querySelectorAll(".cloud").forEach((el) => {
      const w = el.offsetWidth, h = el.offsetHeight;
      if (!w || !h) return;
      let svg = el.querySelector(":scope > svg");
      if (!svg) { svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.setAttribute("aria-hidden", "true"); svg.appendChild(document.createElementNS("http://www.w3.org/2000/svg", "path")); el.prepend(svg); }
      svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
      svg.firstChild.setAttribute("d", cloudPath(w, h, Number(el.dataset.bump) || 24, Number(el.dataset.seed) || 1));
    });
  }

  // ---------- 操作 ----------
  document.addEventListener("click", (e) => {
    if (audio && audio.state === "suspended") audio.resume().catch(() => {});
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act;
    if (act === "pick") {
      me = el.dataset.name;
      store.set(K.me, me);
      picking = false;
      serverStars = new Set();
      render();
      poll();
    } else if (act === "who") {
      picking = true;
      clearTimeout(timer);
      render();
      window.scrollTo(0, 0);
    } else if (act === "alerts") enableAlerts();
    else if (act === "filter") {
      filter = el.dataset.f;
      store.set(K.filter, filter);
      renderList();
      window.scrollTo(0, 0);
    } else if (act === "open") openDetail(el.dataset.id, true);
    else if (act === "star") toggleStar(el.dataset.id);
    else if (act === "close") closeDetail();
    else if (act === "prev") step(-1);
    else if (act === "next") step(1);
    else if (act === "readAll") {
      for (const it of items.values()) read[it.id] = it.updatedAt;
      store.set(K.read, JSON.stringify(read));
      renderList();
    } else if (act === "toTop") {
      if (openId) closeDetail();
      clearUnseen();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  });
  document.addEventListener("keydown", (e) => {
    if (!openId) return;
    if (e.key === "Escape") closeDetail();
    if (e.key === "ArrowRight") step(1);
    if (e.key === "ArrowLeft") step(-1);
  });
  window.addEventListener("popstate", () => { if (openId) closeDetail(true); });
  window.addEventListener("scroll", () => {
    if (window.scrollY < 80 && unseen && !openId) clearUnseen();
    else if (unseen) showBanner();
  }, { passive: true });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return;
    if (alertsOn) keepAwake();
    poll();
  });
  setInterval(() => { if (loaded && !openId && !picking) renderList(true); }, 30000);

  render();
  poll();
  document.fonts && document.fonts.ready.then(() => paintClouds(document));
})();
</script>
</body>
</html>
