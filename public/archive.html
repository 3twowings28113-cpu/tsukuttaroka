<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>過去の記録｜投稿、つくったろか。</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Zen+Maru+Gothic:wght@900&display=swap">
<style>
  /* 過去のイベントの記録（見るだけ）。運営ページと同じ見た目 */
  :root {
    color-scheme: light;
    --bg: #F6F4EE; --paper: #FFFFFF; --ink: #121212; --sub: #5F5A4F; --rule: #DAD5C9;
    --blue: #0A66C2; --blue-press: #004182; --coral: #FF7373; --hl: #FFFBE6;
    --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    --f-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Noto Sans JP", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 500 15px/1.6 var(--f-body); }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  [hidden] { display: none !important; }
  header { position: sticky; top: 0; z-index: 5; background: #3A3A3A; color: #fff; border-bottom: 2px solid var(--ink); }
  .bar { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .title { font-family: var(--f-display); font-weight: 900; font-size: 18px; margin: 0; }
  .title small { font-family: var(--f-body); font-weight: 700; font-size: 12px; margin-left: 8px; opacity: .85; }
  header a { color: #fff; font-weight: 700; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  .panel { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; }
  .panel h2 { margin: 0 0 10px; font-size: 16px; }
  .btn { min-height: 42px; padding: 0 14px; border: 2px solid var(--ink); border-radius: 10px; background: var(--paper); font-weight: 700; cursor: pointer; }
  .btn-primary { background: var(--blue); color: #fff; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .login { max-width: 420px; margin: 40px auto; display: grid; gap: 10px; }
  .login input { min-height: 46px; padding: 0 12px; border: 2px solid var(--ink); border-radius: 10px; background: #fff; font-size: 16px; }
  .msg { font-size: 14px; font-weight: 700; }
  .bad { color: #B3261E; }
  .empty { color: var(--sub); font-size: 14px; }
  .note { margin: 0; padding: 10px 12px; border-left: 4px solid var(--blue); background: #EEF4FB; font-size: 14px; }
  .pick select { min-height: 42px; padding: 0 10px; border: 2px solid var(--ink); border-radius: 10px; background: #fff; font-weight: 700; max-width: 100%; }
  .nums { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .num { border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; background: #FBFAF7; }
  .num b { display: block; font-size: 26px; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .num span { font-size: 12px; color: var(--sub); font-weight: 700; }
  .awards { display: grid; gap: 10px; padding: 10px 12px; border: 2px solid var(--ink); border-radius: 10px; background: var(--hl); }
  .awards h3 { margin: 0 0 2px; font-size: 15px; }
  .award-names { display: flex; flex-wrap: wrap; gap: 2px 16px; font-size: 20px; font-weight: 700; line-height: 1.5; }
  .award-sub { font-size: 12px; color: var(--sub); font-weight: 700; }
  .none { margin: 0; color: var(--sub); font-size: 14px; font-weight: 400; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { font-size: 12px; color: var(--sub); white-space: nowrap; }
  td.n { white-space: nowrap; font-variant-numeric: tabular-nums; }
  tr.item { cursor: pointer; }
  tr.item:hover td { background: #FBFAF6; }
  tr.detail td { background: #FBFAF6; }
  tr.is-hidden td { color: var(--sub); text-decoration: line-through; }
  .pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #fff; border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
  .tag { display: inline-block; padding: 0 8px; border-radius: 6px; background: #EEF3F8; font-size: 12px; font-weight: 700; margin: 0 4px 4px 0; }
  @media (max-width: 720px) { .nums { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 class="title">過去の記録<small>投稿、つくったろか。</small></h1>
    <a href="admin">運営ページ（いまのイベント）にもどる</a>
  </div>
</header>
<main>
  <section class="panel login" id="login" hidden>
    <h2>運営ページの合言葉を入れてください</h2>
    <input id="pass" type="password" autocomplete="current-password" aria-label="合言葉">
    <button class="btn btn-primary" id="loginBtn" type="button">ひらく</button>
    <p class="msg bad" id="loginMsg" role="alert"></p>
  </section>

  <div id="dash" hidden style="display:grid;grid-template-columns:minmax(0,1fr);gap:16px">
    <section class="panel pick">
      <h2>どのイベントの記録を見る？</h2>
      <div class="row"><select id="archiveSel" aria-label="過去のイベント"></select></div>
      <p class="note" id="archiveNote" style="margin-top:10px"></p>
    </section>

    <section class="nums" id="nums" aria-label="件数"></section>

    <section class="panel">
      <h2>表彰リスト（呼ぶ順）</h2>
      <div class="awards" id="awards"></div>
    </section>

    <section class="panel">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <h2 style="margin:0">投稿報告<span class="empty" id="repCount"></span></h2>
        <button class="btn" id="repCsv" type="button">報告のCSV</button>
      </div>
      <p class="empty" style="margin:0 0 8px">行を押すと、全文と★を付けた人が出ます。</p>
      <div class="table-wrap"><table>
        <thead><tr><th>報告</th><th>名前</th><th>作り方</th><th>★</th><th>本文（冒頭）</th><th>リンク</th></tr></thead>
        <tbody id="repRows"></tbody>
      </table></div>
    </section>

    <section class="panel">
      <h2>アプリを使った人<span class="empty" id="peopleCount"></span></h2>
      <div class="table-wrap"><table>
        <thead><tr><th>名前</th><th>フォロー</th><th>作った</th><th>コピー</th><th>報告</th></tr></thead>
        <tbody id="peopleRows"></tbody>
      </table></div>
    </section>

    <section class="panel">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <h2 style="margin:0">集まった投稿（共有ONの人だけ）<span class="empty" id="postCount"></span></h2>
        <button class="btn" id="postCsv" type="button">投稿のCSV</button>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>日時</th><th>立場</th><th>ネタ</th><th>投稿文（冒頭）</th></tr></thead>
        <tbody id="postRows"></tbody>
      </table></div>
      <div class="row" style="margin-top:10px"><button class="btn" id="moreBtn" type="button" hidden>もっと見る</button></div>
    </section>
  </div>
</main>
<script src="config.js"></script>
<script>
(() => {
  const KEY = "tsukuttaroka.admin";
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const PRESETS = window.APP_PRESETS || [];
  let pass = "";
  try { pass = localStorage.getItem(KEY) || sessionStorage.getItem(KEY) || ""; } catch {}
  let archives = [];
  let cur = null;
  let offset = 0;

  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: { "content-type": "application/json", "x-admin-passcode": pass } });
    if (res.status === 401 || res.status === 403) {
      const d = await res.json().catch(() => ({}));
      throw Object.assign(new Error(d.message || "auth"), { auth: true });
    }
    return res;
  }
  const q = (path) => `${path}${path.includes("?") ? "&" : "?"}a=${encodeURIComponent(cur.id)}`;

  async function start() {
    const d = await (await api("api/admin/archives")).json();
    archives = d.archives || [];
    $("#login").hidden = true;
    $("#dash").hidden = false;
    if (!archives.length) {
      $("#archiveSel").innerHTML = "";
      $("#archiveNote").textContent = "まだ過去のイベントはありません。運営ページの「データ」から「ここまでを過去のイベントにする」で作れます。";
      return;
    }
    $("#archiveSel").innerHTML = archives.map((a) => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join("");
    const want = new URLSearchParams(location.search).get("a");
    $("#archiveSel").value = archives.some((a) => a.id === want) ? want : archives[0].id;
    await show();
  }
  async function show() {
    cur = archives.find((a) => a.id === $("#archiveSel").value) || archives[0];
    $("#archiveNote").textContent = `${cur.fromJst ? `${cur.fromJst} から ` : ""}${cur.untilJst} までのデータです（報告 ${cur.reports}件・作った ${cur.made}回）。見るだけのページで、消したり変えたりはしません。`;
    const [sum, reps] = await Promise.all([(await api(q("api/admin/summary"))).json(), (await api(q("api/admin/reports"))).json()]);
    const c = sum.counts || {};
    const cell = (label, n) => `<div class="num"><b>${n || 0}</b><span>${label}</span></div>`;
    $("#nums").innerHTML = cell("作った", c.generate) + cell("書き直し", c.refine) + cell("コピー", c.copy) + cell("あとで投稿", c.later) + cell("投稿報告", c.report);
    renderReports(reps.rows || []);
    const people = sum.people || [];
    $("#peopleCount").textContent = `　${people.length}人`;
    $("#peopleRows").innerHTML = people.length
      ? people.map((p) => `<tr><td>${esc(p.name)}</td><td class="n">${p.followed ? "済" : "—"}</td><td class="n">${p.made ? p.made + "回" : "—"}</td><td class="n">${p.copied ? "済" : "—"}</td><td class="n">${p.reported ? "済" : "—"}</td></tr>`).join("")
      : '<tr><td colspan="5" class="empty">記録がありません</td></tr>';
    $("#postCount").textContent = `　${sum.posts || 0}件`;
    $("#postRows").innerHTML = "";
    offset = 0;
    await loadPosts();
  }
  function renderReports(rows) {
    const visible = rows.filter((r) => !r.hidden);
    $("#repCount").textContent = `　${visible.length}件`;
    const judges = (PRESETS.find((p) => p.id === cur.preset) || {}).judges || [];
    const picksBy = new Map();
    const pickers = new Map();
    for (const r of visible) for (const j of r.stars || []) {
      if (!picksBy.has(j)) picksBy.set(j, []);
      picksBy.get(j).push(r.name);
      if (!pickers.has(r.name)) pickers.set(r.name, []);
      pickers.get(r.name).push(j);
    }
    const order = [...judges, ...[...picksBy.keys()].filter((j) => !judges.includes(j))];
    $("#awards").innerHTML = order.length
      ? order.map((j) => {
          const names = picksBy.get(j) || [];
          return `<div><h3>${esc(j)}</h3>${names.length ? `<div class="award-names">${names.map((n) => { const o = (pickers.get(n) || []).filter((x) => x !== j); return `<span>${esc(n)}${o.length ? `<span class="award-sub">（${esc(o.join("・"))}も）</span>` : ""}</span>`; }).join("")}</div>` : '<p class="none">選んでいません</p>'}</div>`;
        }).join("")
      : '<p class="none">★の記録はありません</p>';
    $("#repRows").innerHTML = rows.length
      ? rows.map((r) => {
          const ex = String(r.body || "").replace(/\s+/g, " ");
          return `<tr class="item${r.hidden ? " is-hidden" : ""}" data-rid="${esc(r.id)}" tabindex="0">
            <td class="n">${esc(r.at)}</td><td><b>${esc(r.name)}</b>${r.hidden ? ' <span class="tag">隠した</span>' : ""}</td>
            <td class="n">${r.source === "self" ? "自分で" : "アプリ"}</td><td class="n">${r.stars.length ? "★" + r.stars.length : ""}</td>
            <td>${ex ? esc(ex.slice(0, 48)) + (ex.length > 48 ? "…" : "") : '<span class="empty">（本文なし）</span>'}</td>
            <td>${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">開く</a>` : "—"}</td></tr>
            <tr class="detail" id="rd-${esc(r.id)}" hidden><td colspan="6"><div class="pre">${esc(r.body || "（本文なし）")}</div>${r.stars.length ? `<p style="margin:6px 0 0">★を付けた人：${r.stars.map(esc).join("、")}</p>` : ""}</td></tr>`;
        }).join("")
      : '<tr><td colspan="6" class="empty">報告はありません</td></tr>';
  }
  async function loadPosts() {
    const d = await (await api(q(`api/admin/posts?limit=50&offset=${offset}`))).json();
    const rows = d.rows || [];
    offset += rows.length;
    $("#postRows").insertAdjacentHTML("beforeend", rows.map((r) => `<tr class="item" data-pid="${r.id}" tabindex="0"><td class="n">${esc(r.at)}</td><td class="n">${esc(r.role || "—")}</td><td>${esc((r.cards || []).join("、"))}</td><td>${esc(String(r.finalText || "").replace(/\s+/g, " ").slice(0, 48))}…</td></tr><tr class="detail" id="pd-${r.id}" hidden><td colspan="4"><div class="pre">${esc(r.finalText || "")}</div></td></tr>`).join(""));
    if (!offset) $("#postRows").innerHTML = '<tr><td colspan="4" class="empty">集まった投稿はありません</td></tr>';
    $("#moreBtn").hidden = rows.length < 50;
  }
  async function download(path, fallback) {
    const res = await api(q(path));
    const blob = await res.blob();
    const m = (res.headers.get("content-disposition") || "").match(/filename="([^"]+)"/);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = m ? m[1] : fallback;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  const toggle = (e, attr, prefix) => {
    const tr = e.target.closest(`tr.item[${attr}]`);
    if (!tr || e.target.closest("a")) return;
    const d = document.getElementById(prefix + tr.getAttribute(attr));
    if (d) d.hidden = !d.hidden;
  };
  $("#repRows").addEventListener("click", (e) => toggle(e, "data-rid", "rd-"));
  $("#postRows").addEventListener("click", (e) => toggle(e, "data-pid", "pd-"));
  $("#archiveSel").addEventListener("change", () => show().catch(() => {}));
  $("#moreBtn").addEventListener("click", () => loadPosts().catch(() => {}));
  $("#repCsv").addEventListener("click", () => download("api/admin/export-reports", "reports.csv").catch(() => {}));
  $("#postCsv").addEventListener("click", () => download("api/admin/export", "posts.csv").catch(() => {}));
  async function login() {
    pass = $("#pass").value.trim();
    try {
      await start();
      try { localStorage.setItem(KEY, pass); } catch {}
    } catch (e) {
      $("#loginMsg").textContent = e.auth ? e.message : "つながりませんでした";
    }
  }
  $("#loginBtn").addEventListener("click", login);
  $("#pass").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
  if (pass) start().catch(() => { $("#login").hidden = false; });
  else $("#login").hidden = false;
})();
</script>
</body>
</html>
